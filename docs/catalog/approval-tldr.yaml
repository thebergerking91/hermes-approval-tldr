name: approval-tldr
repo: https://github.com/thebergerking91/hermes-approval-tldr
sha: <sha>
description: "Plain-English explanation on every dangerous-command approval prompt: once selected with security.approval.transport: tldr, each shell or execute_code prompt on Telegram/Discord, Desktop or the CLI gains a short AI-written paragraph (labelled as AI and possibly wrong) saying what the command does, what it touches, whether it can be undone and a LOW/MEDIUM/HIGH risk verdict, next to the unchanged real command and buttons; Hermes keeps all authority and the plugin only relays the person's answer. Disclosure — each prompt's command text and flag reason (Hermes-redacted, best-effort) go to the user's configured LLM provider through ctx.llm (auxiliary task approval_summary); re-shows the prompt on Hermes' own card through internal approval functions (called, never patched) that a Hermes release can break; any non-answer, /stop or unoffered scope is a deny; the documented install steps set transport_fallback: builtin (host-wide), so a failure shows the stock prompt and a timeout can ask twice; reads no credentials, writes no files, starts no processes, no other network"
maintainer: thebergerking91
tier: community
category: tools
requires_hermes: ">=0.22.2"
docs_url: https://github.com/thebergerking91/hermes-approval-tldr#readme
version: "0.1.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_approval_request
    - post_approval_response
  provides_middleware: []
  requires_env: []
