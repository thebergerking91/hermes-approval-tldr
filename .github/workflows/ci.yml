name: CI

# Why: the pull-request gate. The upstream canary (upstream-canary.yml) runs on a schedule and on
# pushes to main and opens issues, so it cannot be a required status check for PRs (a check that
# never runs on a PR blocks the PR forever, and a fork PR has no issues:write token). This job
# runs the seam check and the full test suite against the newest stable hermes-agent release —
# the version `hermes update` installs — on every PR and push. The `main` branch ruleset requires
# the `test` job to pass before a PR can merge.
#
# Security: read-only token, no secrets, every action pinned to a full commit SHA (Dependabot
# keeps the pins current), and nothing from PR titles/bodies/branch names reaches a shell.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: plugin
          persist-credentials: false

      - name: Checkout hermes-agent (full tags so the newest release can be resolved)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the newest stable hermes-agent tag
        shell: bash
        working-directory: hermes-agent
        run: |
          set -euo pipefail
          tag=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "Testing against hermes-agent $tag"
          git checkout -q "$tag"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the few runtime deps the plugin's import graph touches
        run: python -m pip install -q pytest requests psutil "ruamel.yaml"

      - name: Seam check
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          python plugin/scripts/seam_check.py

      - name: Test suite
        shell: bash
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: python -m pytest tests -q

      - name: No tracked bytecode or binaries (catalog rule 17)
        shell: bash
        working-directory: plugin
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '\.(pyc|pyo|so|dylib|dll|exe|wasm)$' || true)
          if [ -n "$bad" ]; then echo "::error::tracked binary/bytecode files: $bad"; exit 1; fi
          echo "ok"
